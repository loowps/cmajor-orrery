name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Version stamped into the built patch manifest
        type: string
        default: ''

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CMAJOR_VERSION: 1.0.3175

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit --run --passWithNoTests

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build patch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Stamp version into manifest
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('node:fs')
            const file = 'dist/Orrery.cmajorpatch'
            const manifest = JSON.parse(fs.readFileSync(file, 'utf8'))
            manifest.version = process.env.VERSION
            fs.writeFileSync(file, JSON.stringify(manifest, null, 4) + '\n')
          "

      - name: Install Cmajor
        run: |
          curl -fsSL -o cmajor.zip \
            "https://github.com/cmajor-lang/cmajor/releases/download/${CMAJOR_VERSION}/cmajor.linux.x64.zip"
          unzip -q cmajor.zip -d "$RUNNER_TEMP/cmajor"
          cmaj="$(find "$RUNNER_TEMP/cmajor" -type f -name cmaj | head -n 1)"
          chmod +x "$cmaj"
          echo "$(dirname "$cmaj")" >> "$GITHUB_PATH"

      # cmaj reports compile errors but still exits 0, so its output has to be inspected.
      - name: Compile DSP
        run: |
          cmaj version
          cmaj play --no-gui --dry-run --stop-on-error dist/Orrery.cmajorpatch 2>&1 | tee cmaj.log
          if grep -q ': error:' cmaj.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: orrery-patch
          path: dist/
          retention-days: 7
