name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      # The tag must be package.json's version, optionally with a pre-release suffix (v1.0.0-alpha.1),
      # so the repository never claims a different version than the release it produced.
      - id: resolve
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$base" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$base" ]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Publish release
    needs: [version, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: LICENSE
          sparse-checkout-cone-mode: false
          path: source

      - uses: actions/download-artifact@v5
        with:
          name: orrery-patch
          path: Orrery

      - name: Package
        run: |
          cp source/LICENSE Orrery/LICENSE
          zip -r "Orrery-${VERSION}.zip" Orrery

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "Orrery-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Orrery ${VERSION}" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
